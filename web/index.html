      <button type="button" data-showcase-prev aria-label="Previous artwork">Prev</button>
      <button type="button" data-showcase-next aria-label="Next artwork">Next</button>
    </div>

    <a href="collection.html" class="home-showcase-link">
      View the full collection
    </a>
