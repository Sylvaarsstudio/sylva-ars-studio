    <div class="artwork">
      <div class="image-wrapper">
        <a href="artworks/{{slug}}.html">
          <img src="images/{{image}}" alt="{{altText}}">

          <div class="view-artwork">
            View Artwork
          </div>
        </a>
      </div>

      <h2>{{title}}</h2>

      <p class="art-medium">
        {{year}} · {{medium}} · {{dimensions}}
      </p>

      <p class="art-description">
        {{longDescription}}
      </p>
    </div>
