<!DOCTYPE html>
<!-- AUTO-GENERATED ARTWORK PAGE - DO NOT EDIT MANUALLY -->
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{{seoTitle}}</title>
  <meta name="description" content="{{seoDescription}}">

  <link rel="stylesheet" href="../css/main.css">
</head>

<body>

  <nav class="navbar">
    <a href="../index.html">Home</a>
    <a href="../collection.html">Collection</a>
    <a href="../about.html">About</a>
    <a href="../contact.html">Contact</a>
  </nav>

  <section class="artwork-page">

    <img src="../images/{{image}}" alt="{{altText}}" class="artwork-main-image">

    <div class="artwork-page-info">

      <h1>{{title}}</h1>

      <p class="art-medium">
        {{year}} · {{medium}}
      </p>

      <p>
        {{shortDescription}}
      </p>

      <p>
        <strong>Dimensions:</strong> {{dimensions}}
      </p>

      <p>
        Part of the <strong>{{collection}}</strong> collection.
      </p>

      <p class="art-status">
        {{status}}
      </p>

      <a href="../contact.html" class="button">Inquire</a>
      <a href="../collection.html" class="back-link">Back to Collection</a>

    </div>

  </section>

</body>
</html>
