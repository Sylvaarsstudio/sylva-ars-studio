<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Collaboration | Sylva Ars Studio</title>

  <link rel="stylesheet" href="css/main.css">
</head>

<body>

  <nav class="navbar">
    <a href="index.html">Home</a>
    <a href="collection.html">Collection</a>
    <a href="studio-notes/">Studio Notes</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>

  <section class="contact-page">

    <img src="images/logo.png" alt="Sylva Ars Studio Logo" class="logo">

    <h1>Collaboration</h1>

    <p>
      Use this form for creative partnerships, exhibitions,
      editorial projects, or studio collaborations.
    </p>

    <form
      name="collaboration"
      method="POST"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      class="contact-form">

      <input type="hidden" name="form-name" value="collaboration">
      <input type="hidden" name="form_type" value="collaboration">

      <p class="hidden-field">
        <label>
          Do not fill this out if you are human
          <input name="bot-field">
        </label>
      </p>

      <label>
        Client Name
        <input type="text" name="client_name" autocomplete="name" required>
      </label>

      <label>
        Email
        <input type="email" name="client_email" autocomplete="email" required>
      </label>

      <label>
        Phone Optional
        <input type="tel" name="client_phone" autocomplete="tel">
      </label>

      <label>
        Organization / Project
        <input type="text" name="organization_project">
      </label>

      <label>
        Collaboration Type
        <select name="collaboration_type" required>
          <option value="">Select one</option>
          <option value="Exhibition">Exhibition</option>
          <option value="Editorial / Press">Editorial / Press</option>
          <option value="Brand / Creative Project">Brand / Creative Project</option>
          <option value="Gallery / Organization">Gallery / Organization</option>
          <option value="Other">Other</option>
        </select>
      </label>

      <label>
        Timeline
        <select name="estimated_date">
          <option value="">Select one</option>
          <option value="flexible">Flexible / No specific deadline</option>
          <option value="within_1_month">Within 1 month</option>
          <option value="within_2_months">Within 2 months</option>
          <option value="within_3_months">Within 3 months</option>
        </select>
      </label>

      <label>
        Specific Occasion Optional
        <select name="occasion">
          <option value="none">None</option>
          <option value="birthday">Birthday</option>
          <option value="valentines_day">Valentine's Day</option>
          <option value="mothers_day">Mother's Day</option>
          <option value="fathers_day">Father's Day</option>
          <option value="graduation">Graduation</option>
          <option value="wedding_anniversary">Wedding / Anniversary</option>
          <option value="halloween">Halloween</option>
          <option value="thanksgiving">Thanksgiving</option>
          <option value="christmas_holiday">Christmas / Holiday Season</option>
          <option value="national_holiday">National Holiday / Patriotic Holiday</option>
          <option value="other">Other</option>
        </select>
      </label>

      <label>
        Message
        <textarea name="message" rows="6" required></textarea>
      </label>

      <button type="submit" class="button">
        Send Collaboration Inquiry
      </button>

    </form>

  </section>

  <script src="js/inquiry-forms.js"></script>

</body>
</html>
