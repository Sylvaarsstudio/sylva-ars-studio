<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Collaboration | Sylva Ars Studio</title>

  <link rel="stylesheet" href="css/main.css">
</head>

<body>

  <nav class="navbar">
    <a href="index.html">Home</a>
    <a href="collection.html">Collection</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>

  <section class="contact-page">

    <img src="images/logo.png" alt="Sylva Ars Studio Logo" class="logo">

    <h1>Collaboration</h1>

    <p>
      Use this form for creative partnerships, exhibitions,
      editorial projects, or studio collaborations.
    </p>

    <form
      name="collaboration"
      method="POST"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      class="contact-form">

      <input type="hidden" name="form-name" value="collaboration">
      <input type="hidden" name="form-type" value="collaboration">

      <p class="hidden-field">
        <label>
          Do not fill this out if you are human
          <input name="bot-field">
        </label>
      </p>

      <label>
        Client Name
        <input type="text" name="client-name" autocomplete="name" required>
      </label>

      <label>
        Email
        <input type="email" name="email" autocomplete="email" required>
      </label>

      <label>
        Phone Optional
        <input type="tel" name="phone" autocomplete="tel">
      </label>

      <label>
        Organization / Project
        <input type="text" name="organization-project">
      </label>

      <label>
        Collaboration Type
        <select name="collaboration-type" required>
          <option value="">Select one</option>
          <option value="Exhibition">Exhibition</option>
          <option value="Editorial / Press">Editorial / Press</option>
          <option value="Brand / Creative Project">Brand / Creative Project</option>
          <option value="Gallery / Organization">Gallery / Organization</option>
          <option value="Other">Other</option>
        </select>
      </label>

      <label>
        Timeline
        <input type="text" name="timeline" placeholder="Example: flexible, this fall, specific date">
      </label>

      <label>
        Message
        <textarea name="message" rows="6" required></textarea>
      </label>

      <button type="submit" class="button">
        Send Collaboration Inquiry
      </button>

    </form>

  </section>

  <script src="js/inquiry-forms.js"></script>

</body>
</html>
