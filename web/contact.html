<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact | Sylva Ars Studio</title>

  <link rel="stylesheet" href="css/main.css">

  <link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
/>
</head>

<body>

  <nav class="navbar">

    <a href="index.html">Home</a>
    <a href="collection.html">Collection</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>

  </nav>

  <section class="contact-page">

    <img src="images/logo.png" alt="Sylva Ars Studio Logo" class="logo">

    <h1>Contact</h1>

    <p>
      For inquiries regarding original artwork,
      collaborations, or commissions:
    </p>

    <a href="mailto:contact@sylvaarsstudio.com" class="email-link" data-business-field="email">
    </a>

    <address class="business-contact">
      <strong data-business-field="name"></strong>
      <span data-business-field="addressLine1"></span>
      <span data-business-field="addressLine2"></span>
      <a data-business-field="phone"></a>
      <a data-business-field="website"></a>
    </address>

    <div class="inquiry-selector">
      <label>
        Inquiry Type
        <select id="inquiry-router">
          <option value="contact">Contact / General Inquiry</option>
          <option value="artwork-inquiry">Artwork Inquiry</option>
          <option value="commission-request">Commission Request</option>
          <option value="collaboration">Collaboration</option>
        </select>
      </label>
    </div>

    <form name="contact" method="POST" data-netlify="true" class="contact-form">

  <input type="hidden" name="form-name" value="contact">
  <input type="hidden" name="form-type" value="contact">

  <label>
    Name
    <input type="text" name="name" required>
  </label>

  <label>
    Email
    <input type="email" name="email" required>
  </label>

  <label>
    Message
    <textarea name="message" rows="6" required></textarea>
  </label>

  <button type="submit" class="button">
    Send Inquiry
  </button>

</form>
<div class="social-links">

  <a href="https://instagram.com/sylvaarsstudio" target="_blank">
    <i class="fa-brands fa-instagram"></i>
  </a>

  <a href="https://pinterest.com/sylvaarsstudio" target="_blank">
    <i class="fa-brands fa-pinterest"></i>
  </a>

  <a href="https://www.youtube.com/@sylvaarsstudio" target="_blank">
    <i class="fa-brands fa-youtube"></i>
  </a>

</div>

  </section>

<script src="js/business-info.js"></script>
<script src="js/inquiry-forms.js"></script>
</body>
</html>
